<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Figma Gateway Plugin Bridge</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 12px/1.45 Inter, system-ui, sans-serif;
        background: #1e1e1e;
        color: #f5f5f5;
      }
      .wrap { padding: 12px; }
      .title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
      .row { margin-bottom: 8px; }
      .label { color: #a3a3a3; margin-bottom: 2px; }
      .value {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 6px 8px;
        word-break: break-word;
      }
      .pill {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid #3a3a3a;
        background: #2a2a2a;
      }
      .ok { color: #86efac; }
      .warn { color: #facc15; }
      .err { color: #fca5a5; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        background: #3b82f6;
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button.secondary { background: #3a3a3a; }
      .muted { color: #a3a3a3; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Figma Gateway Plugin Bridge</div>
      <div class="actions">
        <button id="refreshBtn" class="secondary">Refresh status</button>
        <button id="reconnectBtn" class="secondary">Reconnect session</button>
        <button id="copyBtn">Copy sessionId</button>
        <button id="keepCurrentBtn" class="secondary">Active sessions: 0</button>
      </div>
      <div class="row">
        <div class="label">Status</div>
        <div id="status" class="value"><span class="pill warn">Starting</span></div>
      </div>
      <div class="row">
        <div class="label">Session</div>
        <div id="sessionId" class="value muted">—</div>
      </div>
      <div class="row">
        <div class="label">File</div>
        <div id="fileInfo" class="value muted">—</div>
      </div>
      <div class="row">
        <div class="label">Last poll</div>
        <div id="lastPoll" class="value muted">—</div>
      </div>
      <div class="row">
        <div class="label">Last command</div>
        <div id="lastCommand" class="value muted">—</div>
      </div>
      <div class="row">
        <div class="label">Pending count</div>
        <div id="pendingCount" class="value muted">0</div>
      </div>
      <div class="row">
        <div class="label">Active sessions in this file</div>
        <div id="activeSessionCount" class="value muted">0</div>
      </div>
      <div class="row">
        <div class="label">Last error</div>
        <div id="lastError" class="value muted">—</div>
      </div>
    </div>
    <script>
      let latestState = null;
      function setText(id, value) {
        document.getElementById(id).textContent = value || '—';
      }
      function setStatus(status, connected) {
        const cls = status === 'error' ? 'err' : connected ? 'ok' : 'warn';
        const label = connected ? 'Connected' : status === 'error' ? 'Error' : status || 'Starting';
        document.getElementById('status').innerHTML = '<span class="pill ' + cls + '">' + label + '</span>';
      }
      function render(state) {
        latestState = state;
        setStatus(state.status, !!state.connected);
        setText('sessionId', state.sessionId || '—');
        setText('fileInfo', [state.fileName || 'Untitled', state.fileKey || state.localFileKey || 'no-file-key'].join(' • '));
        setText('lastPoll', state.lastPollAt || '—');
        setText('lastCommand', state.lastCommand || '—');
        setText('lastError', state.lastError || '—');
        setText('pendingCount', String(typeof state.pendingCount === 'number' ? state.pendingCount : 0));
        const activeCount = typeof state.activeSessionCount === 'number' ? state.activeSessionCount : 0;
        setText('activeSessionCount', String(activeCount));
        document.getElementById('keepCurrentBtn').textContent = 'Active sessions: ' + String(activeCount);
      }
      onmessage = function (event) {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'bridge-status') render(msg.state);
      };
      document.getElementById('refreshBtn').onclick = function () {
        parent.postMessage({ pluginMessage: { type: 'request-status' } }, '*');
      };
      document.getElementById('reconnectBtn').onclick = function () {
        parent.postMessage({ pluginMessage: { type: 'reconnect-session' } }, '*');
      };
      document.getElementById('copyBtn').onclick = function () {
        const value = latestState && latestState.sessionId ? latestState.sessionId : '';
        parent.postMessage({ pluginMessage: { type: 'copy-session-id', value: value } }, '*');
      };
      document.getElementById('keepCurrentBtn').onclick = function () {
        parent.postMessage({ pluginMessage: { type: 'keep-current-session' } }, '*');
      };
      parent.postMessage({ pluginMessage: { type: 'request-status' } }, '*');
    </script>
  </body>
</html>
