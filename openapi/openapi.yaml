openapi: 3.1.0
info:
  title: Figma Gateway Read-Only API
  version: 0.1.0
  summary: Read-only HTTP API for Figma file inspection and search
  description: 'Read-only API over the internal Figma client.


    Response success shape:

    `{ "success": true, "data": ... }`


    Response error shape:

    `{ "success": false, "error": { "code": "...", "message": "..." } }`


    Authentication:

    the Node.js application does not currently enforce auth at route level.

    For GPT Actions production exposure, place this API behind HTTPS and a reverse proxy

    or API gateway that validates a bearer token. The `bearerAuth` scheme below documents

    the expected external contract for that deployment model.

    '
servers:
- url: https://figma-gateway.vazovski.art
  description: Production
- url: http://localhost:3000
  description: Local development
tags:
- name: System
- name: Files
- name: Nodes
- name: Search
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      description: Returns service health and uptime.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
              examples:
                ok:
                  value:
                    success: true
                    data:
                      status: ok
                      service: figma-gateway
                      version: 0.1.0
                      uptime: 123.456
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: metric_context
        in: query
        required: false
        description: JSON object string with correlation_id, segment_id, and activity_window_id. Used instead of deepObject
          for GPT/JIT GET compatibility.
        schema:
          type: string
          maxLength: 512
  /api/files/{fileKey}:
    get:
      tags:
      - Files
      summary: Get Figma file
      description: Returns raw file data from Figma for the specified file key.
      operationId: getFile
      parameters:
      - $ref: '#/components/parameters/FileKey'
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: metric_context
        in: query
        required: false
        description: JSON object string with correlation_id, segment_id, and activity_window_id. Used instead of deepObject
          for GPT/JIT GET compatibility.
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: File payload returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSuccessResponse'
              examples:
                file:
                  value:
                    success: true
                    data:
                      name: Design System
                      document:
                        id: 0:1
                        name: Document
                        type: DOCUMENT
                        children:
                        - id: '1:1'
                          name: Landing Hero
                          type: FRAME
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
  /api/files/{fileKey}/nodes/{nodeId}:
    get:
      tags:
      - Nodes
      summary: Get a single node from a file
      description: Returns one node payload from the specified Figma file.
      operationId: getNode
      parameters:
      - $ref: '#/components/parameters/FileKey'
      - $ref: '#/components/parameters/NodeId'
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: metric_context
        in: query
        required: false
        description: JSON object string with correlation_id, segment_id, and activity_window_id. Used instead of deepObject
          for GPT/JIT GET compatibility.
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Node payload returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileNodeSuccessResponse'
              examples:
                node:
                  value:
                    success: true
                    data:
                      document:
                        id: '1:2'
                        name: CTA Button
                        type: TEXT
                        characters: Get Started
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
  /api/nodes/batch:
    post:
      tags:
      - Nodes
      summary: Get multiple nodes in one request
      description: Returns multiple node payloads from one Figma file.
      operationId: batchGetNodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNodesRequest'
            examples:
              batch:
                value:
                  fileKey: abc123
                  nodeIds:
                  - '1:2'
                  - '1:3'
      responses:
        '200':
          description: Nodes payload returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNodesSuccessResponse'
              examples:
                nodes:
                  value:
                    success: true
                    data:
                      '1:2':
                        document:
                          id: '1:2'
                          name: CTA Button
                          type: TEXT
                      '1:3':
                        document:
                          id: '1:3'
                          name: Footer Link
                          type: TEXT
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
  /api/search/by-name:
    post:
      tags:
      - Search
      summary: Search nodes by node name
      description: Performs simple case-insensitive substring search against `node.name`.
      operationId: searchNodesByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              searchByName:
                value:
                  fileKey: abc123
                  query: button
                  limit: 10
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuccessResponse'
              examples:
                results:
                  value:
                    success: true
                    data:
                      query: button
                      count: 1
                      results:
                      - id: '1:2'
                        name: CTA Button
                        type: TEXT
                        characters: Get Started
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
  /api/search/by-text:
    post:
      tags:
      - Search
      summary: Search nodes by text content
      description: Performs simple case-insensitive substring search against node `characters`.
      operationId: searchNodesByText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              searchByText:
                value:
                  fileKey: abc123
                  query: contact
                  limit: 10
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuccessResponse'
              examples:
                results:
                  value:
                    success: true
                    data:
                      query: contact
                      count: 1
                      results:
                      - id: '1:3'
                        name: Footer Link
                        type: TEXT
                        characters: Contact Us
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
  /api/render:
    post:
      tags:
      - Nodes
      summary: Render Figma nodes to image URLs
      description: Returns image URLs produced by the Figma images endpoint for the provided nodes.
      operationId: renderNodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
            examples:
              render:
                value:
                  fileKey: abc123
                  nodeIds:
                  - '1:2'
                  format: png
      responses:
        '200':
          description: Render URLs returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderSuccessResponse'
              examples:
                render:
                  value:
                    success: true
                    data:
                      images:
                        '1:2': https://cdn.example.com/1-2.png
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: 'External bearer token enforced by reverse proxy or API gateway in production.

        The application currently does not validate this token itself.

        '
  parameters:
    FileKey:
      name: fileKey
      in: path
      required: true
      description: Figma file key
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: abc123
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Figma node ID
      schema:
        type: string
        minLength: 1
      examples:
        default:
          value: '1:2'
  responses:
    ErrorResponse:
      description: Unified error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 'body.nodeIds: Array must contain at least 1 element(s)'
            forbidden:
              value:
                success: false
                error:
                  code: FIGMA_FORBIDDEN
                  message: Invalid scope
  schemas:
    SuccessEnvelope:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
      required:
      - success
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - success
      - error
    HealthData:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        uptime:
          type: number
      required:
      - status
      - service
      - version
      - uptime
    HealthSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/HealthData'
        required:
        - data
    GenericNode:
      type: object
      description: Simplified Figma node shape used for GPT Actions documentation.
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        characters:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/GenericNode'
      required:
      - id
      - name
      - type
    FileData:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        document:
          $ref: '#/components/schemas/GenericNode'
      required:
      - document
    FileSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/FileData'
        required:
        - data
    FileNodeData:
      type: object
      additionalProperties: true
      properties:
        document:
          anyOf:
          - $ref: '#/components/schemas/GenericNode'
          - type: 'null'
      required:
      - document
    FileNodeSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/FileNodeData'
        required:
        - data
    BatchNodesRequest:
      type: object
      additionalProperties: false
      properties:
        fileKey:
          type: string
          minLength: 1
        nodeIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        correlation_id:
          type: string
          maxLength: 80
        metric_context:
          type: object
          properties: &id001
            correlation_id:
              type: string
              maxLength: 80
            segment_id:
              type: string
              maxLength: 80
            activity_window_id:
              type: string
              maxLength: 80
          additionalProperties: false
      required:
      - fileKey
      - nodeIds
    BatchNodesData:
      type: object
      description: Map of nodeId to node payload.
      additionalProperties:
        anyOf:
        - $ref: '#/components/schemas/FileNodeData'
        - type: 'null'
    BatchNodesSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/BatchNodesData'
        required:
        - data
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        fileKey:
          type: string
          minLength: 1
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        correlation_id:
          type: string
          maxLength: 80
        metric_context:
          type: object
          properties: *id001
          additionalProperties: false
      required:
      - fileKey
      - query
    SearchResultItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        characters:
          type: string
      required:
      - id
      - name
      - type
    SearchData:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
      required:
      - query
      - count
      - results
    SearchSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/SearchData'
        required:
        - data
    RenderRequest:
      type: object
      additionalProperties: false
      properties:
        fileKey:
          type: string
          minLength: 1
        nodeIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        format:
          type: string
          enum:
          - jpg
          - png
          - svg
          - pdf
        correlation_id:
          type: string
          maxLength: 80
        metric_context:
          type: object
          properties: *id001
          additionalProperties: false
      required:
      - fileKey
      - nodeIds
      - format
    RenderData:
      type: object
      additionalProperties: false
      properties:
        images:
          type: object
          additionalProperties:
            anyOf:
            - type: string
              format: uri
            - type: 'null'
      required:
      - images
    RenderSuccessResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        additionalProperties: false
        properties:
          data:
            $ref: '#/components/schemas/RenderData'
        required:
        - data
